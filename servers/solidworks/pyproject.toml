[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "solidworks-engineering-mcp"
version = "0.1.1"
description = "Local MCP server for SOLIDWORKS sheet metal, weldments, libraries and drawings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp==1.30.0", "pydantic>=2.10,<3", "pywin32>=310; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
solidworks-mcp = "solidworks_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 110

